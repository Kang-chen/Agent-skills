name: science-paper-narrator

on:
  pull_request:
    paths:
      - "science-paper-narrator/**"
      - ".github/workflows/science-paper-narrator.yml"
  push:
    branches: [main]
    paths:
      - "science-paper-narrator/**"
      - ".github/workflows/science-paper-narrator.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: science-paper-narrator/requirements.txt
      - run: python -m pip install -r science-paper-narrator/requirements.txt
      - run: python -m unittest discover -s science-paper-narrator/tests -p "test_*.py" -v
